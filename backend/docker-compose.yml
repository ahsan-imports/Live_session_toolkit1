services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lst_user
      POSTGRES_PASSWORD: lst_password
      POSTGRES_DB: live_session_toolkit
    ports:
      - "5432:5432"
    volumes:
      - lst_pgdata:/var/lib/postgresql/data

volumes:
  lst_pgdata:
